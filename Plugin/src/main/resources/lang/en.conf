#   !!THIS FILE IS WRITTEN IN THE HOCON FORMAT!!
#   The HOCON format is very similar to JSON, but it has some extra features.
#   You can find more information about the format on the Sponge wiki:
#   https://docs.spongepowered.org/stable/en/server/getting-started/configuration/hocon.html
#   ----------------------------------------------------------------------------------------
#   LibreLogin Messages
#   ----------------------------------------------------------------------------------------
#   This file contains all of the messages used by the plugin, you are welcome to fit them to your needs.
#   The messages are written in the MiniMessage format, for example: <bold><green>Reloaded!</green></bold>
#   You can find more information about the format here: https://docs.advntr.dev/minimessage/format.html
#   The legacy color code format (&a, &l, &#ff8800 etc.) and the § character are NOT supported.
#   You can use the <prefix> placeholder in every message, it will be replaced with the value of the "prefix" key.
#   The language of the messages is set by the "language" option in config.conf.
#   You can find more information about LibreLogin on the GitHub page:
#   https://github.com/Navio1430/LibreLoginProd

# The prefix, which can be inserted anywhere in any message using the <prefix> placeholder. Here you set its content and look (MiniMessage format). Remember to keep the space at the end if it should separate the prefix from the rest of the message.
prefix = "<b>LOGIN |</b> "

# This message is displayed when the Mojang API is rate limiting us, therefore we cannot verify whether there is an account with the given username.
kick-premium-error-throttled = "<red>The Mojang API is rate limiting our server, please try joining again in a while!"

# This message is displayed when there was an unknown issue while communicating with Mojang, therefore we cannot verify whether there is an account with the given username.
# The error will be printed to the console
kick-premium-error-undefined = "<red>There was an issue while communicating with Mojang. If the problem persists, contact the server administrators!"

# This message is displayed when the player enables autologin, they need to be kicked.
kick-premium-info-enabled = "<gray>Autologin enabled!"

# This message is displayed when the player disables autologin, they need to be kicked.
kick-premium-info-disabled = "<gray>Autologin disabled!"

# This message is displayed when the player's username is not in the correct case.
# See https://github.com/Navio1430/LibreLoginProd/wiki/Name-Validation for more information.
kick-invalid-case-username = "<red>Please change your username to <b>%username%</b>"

# This message is displayed when the player's username is already taken.
kick-occupied-username = "<red>Please change your username to <b>%username%</b>"

# This message is displayed when the player's username is not allowed.
# See https://github.com/Navio1430/LibreLoginProd/wiki/Name-Validation for more information.
kick-illegal-username = "<red>Your username contains illegal characters and/or is longer than 16 characters!"

# This occurs when there is a profile conflict.
# See https://github.com/Navio1430/LibreLoginProd/wiki/Profile-Conflicts for more information.
kick-name-mismatch = "<red>Oh no! It looks like a premium user with autologin enabled changed their nickname to %nickname%, therefore there are 2 colliding accounts. Please contact the server staff immediately."

# This message is displayed when the player's username is too short.
# See the configuration key "minimum-username-length" for more information.
kick-short-username = "<red>Your username is too short! The minimum length is %length% characters."

# This message is displayed when the player's IP address has reached the maximum amount of accounts.
# See the configuration key "ip-limit" for more information.
kick-ip-limit = "<red>You have reached the maximum amount of accounts per IP address!"

# This message is displayed when the player is kicked because there is not any server available.
kick-no-lobby = "<red>There's no available lobby to connect you to. Please try again later."

# This message is displayed when the player is kicked because there is not any limbo available.
kick-no-limbo = "<red>There's no available limbo to connect you to. Please try again later. If you're the server administrator, please set up a NanoLimbo server."

# This message is displayed when the player takes too long to authenticate. (You can set this time limit in the configuration file)
kick-time-limit = "<red>You took too long to log in!"

# This message is displayed when the player is kicked because they authenticate with a wrong password.
kick-error-password-wrong = "<red>Wrong password!"

# This message is displayed when the player enables 2FA.
kick-2fa-enabled = "<gray>Two-factor authentication has been enabled! Please reconnect."

# This message is displayed when the player is already connected, but tries to join from another location.
kick-already-connected = "<red>You are already connected to the server!"

# This message is displayed when the player is executing a command, but they are connecting through Floodgate.
error-from-floodgate = "<prefix><red>You can't use this command from Floodgate!"

# This message is displayed when the player tries to recover their password, but they don't have a recovery email set.
error-no-email = "<prefix><red>You don't have a recovery email set!"

# This message is displayed when the player tries to authenticate again.
error-already-authorized = "<prefix><red>You are already logged in!"

# This message is displayed when the player tries to register again.
error-already-registered = "<prefix><red>You are already registered!"

# This message is displayed when the player tries to use a command that requires authentication.
error-not-authorized = "<prefix><red>Please log in first!"

# This message is displayed when the player tries to log in, but they are not registered.
error-not-registered = "<prefix><red>Please register first!"

# This message is displayed when the player tries to enable autologin, but their account does not exist in the Mojang database.
error-not-paid = "<prefix><red>This account does not exist in the Mojang database!"

# This message is displayed when the player tries to disable autologin, but they do not have it enabled.
error-not-premium = "<prefix><red>You do not have autologin enabled, enable it using /premium <password>!"

# This message is displayed when the player tries to enable autologin, but they already have it enabled.
error-not-cracked = "<prefix><red>You have autologin enabled, disable it using /cracked!"

# This message is displayed when the player tries to authenticate with a wrong password.
error-password-wrong = "<prefix><red>Wrong password!"

# This message is displayed when the player tries to change their password without having one.
error-no-password = "<prefix><red>You don't have a password. You can try using /cracked to disable autologin, and then register."

# This message is displayed when the player tries to authenticate without providing a 2FA code.
totp-not-provided = "<red>You must provide a 2FA code! Use /login <password> <2FA code>. If you lost your code, contact the server staff."

# This message is displayed when the player tries to authenticate, or finish enabling 2FA, with a wrong 2FA code.
totp-wrong = "<red>Wrong 2FA code!"

# This message is displayed when the player attempts to finish the 2FA process, but they are not in the process of enabling 2FA.
totp-not-awaiting = "<red>You are currently not in the process of enabling 2FA! Type /2fa to begin the process."

# This message is displayed when the player tries to register with different passwords.
error-password-not-match = "<prefix><red>Passwords do not match!"

# This message is displayed when the player tries to register with a password that is too short or forbidden.
error-forbidden-password = "<prefix><red>The password is too short and/or is not allowed!"

# This message is displayed when the player tries to register with a password that is too long.
error-password-too-long = "<prefix><red>The password is too long!"

# This message is displayed when the player tries to log in with a corrupted password.
error-password-corrupted = "<prefix><red>Your password is corrupted, please contact an administrator!"

# This message is displayed when the Mojang API is rate limiting us, therefore we cannot verify whether there is an account with the given username.
error-premium-throttled = "<prefix><red>The Mojang API is rate limiting our server, please try the command again in a while!"

# This message is displayed when there was an unknown issue while communicating with Mojang, therefore we cannot verify whether there is an account with the given username.
# The error will be printed to the console
error-premium-unknown = "<prefix><red>There was an unknown error while communicating with the Mojang API, check the console for further details!"

# This message is displayed when the player tries to send commands too fast.
error-throttle = "<prefix><red>You are sending commands too fast! Please wait a bit."

# This message is displayed when the player tries to use /premiumconfirm before using /premium.
error-no-confirm = "<prefix><red>Please use /premium <password> first!"

# This message is displayed when the player tries to use /mailconfirm before using /mail.
error-no-mail-confirm = "<prefix><red>Please use /setemail <email> <password> first!"

# This message is displayed when the player tries to use /resetpasswordconfirm before using /resetpassword.
error-no-password-reset = "<prefix><red>Please use /resetpassword first!"

# This message is displayed when the player tries to send emails too fast.
error-mail-throttle = "<prefix><red>You are sending emails too fast! Please wait a bit."

# This message is displayed when the player tries to verify their email with a wrong verification code.
error-wrong-mail-verify = "<prefix><red>Wrong verification code!"

# This message is displayed when the player tries to reset their password with a wrong password reset code.
error-wrong-password-reset = "<prefix><red>Wrong password reset code!"

# This message is displayed when the messages file (lang/<language>.conf) is corrupted.
error-corrupted-messages = "<prefix><red>The messages file is corrupted, the old messages are going to be kept. Cause: %cause%"

# This message is displayed when the configuration file is corrupted.
error-corrupted-configuration = "<prefix><red>The configuration is corrupted, the old one is going to be kept. Cause: %cause%"

# This message is displayed when an unknown error occurs.
error-unknown = "<prefix><red>An unknown error occurred! Check the console for further information."

# This message is displayed when someone refers to an unknown user.
error-unknown-user = "<prefix><red>This user does not exist!"

# This message is displayed when someone tries to move an account to an occupied username.
error-occupied-user = "<prefix><red>This username is already occupied!"

# This message is displayed when someone refers to a player who is online.
error-player-online = "<prefix><red>This player is online!"

# This message is displayed when someone refers to a player who is offline.
error-player-offline = "<prefix><red>This player is offline!"

# This message is displayed when someone refers to a player who is already authenticated.
error-player-authorized = "<prefix><red>This player is already authenticated!"

# This message is displayed when someone refers to a player who is not registered.
error-player-not-registered = "<prefix><red>This player is not registered!"

# This message is displayed when someone tries to use a feature that is not available in MultiProxy mode.
error-not-available-on-multi-proxy = "<prefix><red>This feature is not available in MultiProxy mode!"

# This message is displayed when someone tries to reset their password while this feature is disabled.
error-password-resetting-disabled = "<prefix><red>Password resetting is disabled!"

# This message is displayed when the player does not have permission to use a command.
error-no-permission = "<prefix><red>You do not have permission to use this command!"

# This message is displayed when the player uses a command with invalid syntax.
error-invalid-syntax = "<prefix><red>Usage: <c2>{command}</c2> <c3>{syntax}</c3>"

# This message is displayed when the player uses an unknown command.
error-unknown-command = "<prefix><red>Unknown command!"

# This message is displayed when the player tries to send an email, but sending fails.
error-mail-not-sent = "<prefix><red>Failed to send the email, perhaps you typed your address wrong? If you are sure that it is correct, please contact an administrator."

# This message is displayed when the player is kicked from the server.
info-kick = "<gray>You have been kicked from the server for the following reason: %reason%"

# This message is displayed when the player attempts to log in. Set to a single space " " to disable.
info-logging-in = "<prefix><gray>Logging in..."

# This message is displayed when the player logs in. Set to a single space " " to disable.
info-logged-in = "<prefix><gray>Logged in!"

# This message is displayed when the player is logged in automatically because they have enabled /premium. Set to a single space " " to disable.
info-premium-logged-in = "<prefix><gray>You have been logged in automatically!"

# This message is displayed when the player is logged in automatically because of a valid session. Set to a single space " " to disable.
info-session-logged-in = "<prefix><gray>You have been logged in automatically!"

# This message is displayed when the player attempts to register. Set to a single space " " to disable.
info-registering = "<prefix><gray>Registering..."

# This message is displayed when the player registers. Set to a single space " " to disable.
info-registered = "<prefix><gray>Registered!"

# This message is displayed when something is being enabled.
info-enabling = "<prefix><gray>Enabling..."

# This message is displayed when something is being disabled.
info-disabling = "<prefix><gray>Disabling..."

# This message is displayed when something is being edited.
info-editing = "<prefix><gray>Editing..."

# This message is displayed when something has been edited.
info-edited = "<prefix><gray>Edited!"

# This message is displayed when the player attempts to reset their password.
info-resetting-password = "<prefix><gray>Resetting password..."

# This message is displayed when the player resets their password.
info-password-reset = "<prefix><gray>Your password has been reset! You can now log in with your new password."

# This message is displayed when a user executes /librelogin dump.
info-dumping = "<prefix><gray>Creating dump..."

# This message is displayed when a user executes /librelogin dump.
info-dumped = "<prefix><gray>Dump saved to %file%!"

# This message is displayed when something is being deleted.
info-deleting = "<prefix><gray>Deleting..."

# This message is displayed when something has been deleted.
info-deleted = "<prefix><gray>Deleted!"

# This message is displayed when something is being reloaded.
info-reloading = "<prefix><gray>Reloading..."

# This message is displayed when something has been reloaded.
info-reloaded = "<prefix><gray>Reloaded!"

# This message is displayed when an administrator sets the location where players are placed before logging in. Available placeholders: %world%, %x%, %y%, %z%, %yaw%, %pitch%.
info-login-location-set = "<prefix><gray>Login location set: %world% (%x%, %y%, %z%)."

# This message is displayed when an administrator sets the location where players are placed after logging in. Available placeholders: %world%, %x%, %y%, %z%, %yaw%, %pitch%.
info-hub-spawn-set = "<prefix><gray>Hub spawn set: %world% (%x%, %y%, %z%)."

# This message is displayed when the user executes a command that sends an email.
info-sending-email = "<prefix><gray>Sending email..."

# This message is displayed when the user executes a command that sends an email.
info-sent-email = "<prefix><gray>Email sent!"

# This message is displayed when the information about a player is requested.
info-user = """<prefix><gray>Name: %name%
UUID: %uuid%
Premium UUID: %premium_uuid%
Last seen: %last_seen%
Joined: %joined%
2FA: %2fa%
Email: %email%
IP: %ip%
Last authenticated: %last_authenticated%"""

# This message is displayed when the player executes /librelogin about.
# !! Removing this message, or somehow making the command unexecutable is not only rude, but also considered a violation of the license. !!
info-about = """<prefix><gray>This server is running the free (FOSS) authentication plugin LibreLogin.
Version: %version%
Authors: kyngs and other contributors
Source code: https://github.com/Navio1430/LibreLoginProd
License: Mozilla Public License 2.0"""

# This message is displayed when the player has no alternative accounts (alts).
info-no-alts = "<prefix><gray>There are no other players with the same IP address."

# This message is displayed when the player has alternative accounts (alts).
info-alts = "<prefix><gray>Players with the same IP address (%count%):"

# This message is displayed when the player has alternative accounts (alts).
info-alts-entry = "<gray>- %name% (last seen: %last_seen%)"

# This message is displayed when the user executes a command that sends an email.
info-mail-sending = "<prefix><gray>Sending email..."

# This message is displayed when the user verifies their email address.
info-mail-verified = "<prefix><gray>Email verified! You can now reset your password if you forget it."

# This message is displayed when the user executes a command that sends a verification email.
info-verification-mail-sent = "<prefix><gray>Verification email sent! If you don't see it in your inbox, check your spam folder. You have 10 minutes to verify your email address."

# This message is displayed when the user executes a command that sends a password reset email.
info-reset-password-mail-sent = "<prefix><gray>Password reset email sent! If you don't see it in your inbox, check your spam folder. You have 10 minutes to reset your password."

# This message is displayed when the player is prompted to register.
prompt-register = "<prefix><gray>Please register using: <yellow>/register</yellow> <aqua><password> <password></aqua>"

# This message is displayed when the player is prompted to log in.
prompt-login = "<prefix><gray>Please log in using: <yellow>/login</yellow> <aqua><password> [2fa_code]</aqua>"

# This message is displayed when the player is prompted to confirm autologin.
prompt-confirm = "<prefix><yellow>You are about to enable autologin for premium accounts. Please take note that you <dark_red>WILL NOT</dark_red> be able to connect to your account from a non-premium (cracked) client. You can turn this off later by using /cracked. To confirm this action, you have 5 minutes to type /confirmpremium"

# This title is displayed when the player is prompted to register. Make sure that you have use-titles set to true in the configuration.
title-register = "<gold><bold>Register</bold></gold>"

# This title is displayed when the player is prompted to log in. Make sure that you have use-titles set to true in the configuration.
title-login = "<gold><bold>Login</bold></gold>"

# This title is displayed when the player successfully logs in using /login. Make sure that you have use-titles set to true in the configuration. Set this and sub-title-logged-in to a single space " " to disable.
title-logged-in = "<green><bold>Logged in</bold></green>"

# This title is displayed when the player successfully registers using /register. Make sure that you have use-titles set to true in the configuration. Set this and sub-title-registered to a single space " " to disable.
title-registered = "<green><bold>Registered</bold></green>"

# This title is displayed when the player is logged in automatically (/premium or a valid session). Make sure that you have use-titles set to true in the configuration. Set this and sub-title-auto-login to a single space " " to disable.
title-auto-login = "<green><bold>Logged in</bold></green>"

# This subtitle is displayed when the player is prompted to register. Make sure that you have use-titles set to true in the configuration.
sub-title-register = "<yellow>/register</yellow> <aqua><password> <password></aqua>"

# This subtitle is displayed when the player is prompted to log in. Make sure that you have use-titles set to true in the configuration.
sub-title-login = "<yellow>/login</yellow> <aqua><password></aqua>"

# This subtitle is displayed when the player successfully logs in using /login. Make sure that you have use-titles set to true in the configuration.
sub-title-logged-in = "<gray>Successfully logged in!</gray>"

# This subtitle is displayed when the player successfully registers using /register. Make sure that you have use-titles set to true in the configuration.
sub-title-registered = "<gray>Successfully registered!</gray>"

# This subtitle is displayed when the player is logged in automatically (/premium or a valid session). Make sure that you have use-titles set to true in the configuration.
sub-title-auto-login = "<gray>Logged in automatically!</gray>"

# This action bar is displayed when the player is prompted to register. Make sure that you have use-action-bar set to true in the configuration.
action-bar-register = "<yellow>/register</yellow> <aqua><password> <password></aqua>"

# This action bar is displayed when the player is prompted to log in. Make sure that you have use-action-bar set to true in the configuration.
action-bar-login = "<yellow>/login</yellow> <aqua><password></aqua>"

# This message is displayed when the player is prompted to scan the 2FA QR code.
totp-show-info = """<gray>Please scan the QR code on the map with your 2FA app, for example Google Authenticator or Authy.
When you are done, type the /2faconfirm <code> command to finish the process.
Disconnect to abort."""

# This message is displayed when the player has begun the procedure of enabling 2FA.
totp-generating = "<gray>Generating 2FA code..."

# This message is displayed when the player attempts to enable 2FA with an old client.
totp-wrong-version = "<yellow>You must connect with client version %low% - %high% in order to enable 2FA. You can then connect back with your older version."

# This email is sent to the player when they request to add a recovery email. You can use any HTML code in this message.
email-verification-content = """Hello %name%!<br>
You have requested to add a recovery email on %server%.<br>
If you did not request this, please ignore this email.<br>
To confirm this action, please <b>run the following command in-game: </b><br>
<b><code><h1>/verifyemail %code%</h1></code></b><br>
"""

# This is the subject of the email sent to the player when they request to add a recovery email.
email-verification-subject = "Verify your email on %server%"

# This email is sent to the player when they request to reset their password. You can use any HTML code in this message.
email-password-reset-content = """Hello %name%!<br>
You (from IP %ip%) have requested to reset your password on %server%.<br>
If you did not request this, please ignore this email.<br>
To confirm this action, please <b>run the following command in-game: </b><br>
<b><code><h1>/confirmpasswordreset %code%</h1></code></b><br>
"""

# This is the subject of the email sent to the player when they request to reset their password.
email-password-reset-subject = "Reset your password on %server%"

# This section contains the syntax of commands. It is pretty large, so most people leave the defaults.
syntax {
    # This message is displayed when the player attempts to log in with wrong syntax.
    login = "<password> [2fa_code]"

    # This message is displayed when the player attempts to register with wrong syntax.
    register = "<password> <passwordRepeat>"

    # This message is displayed when the player attempts to enable autologin with wrong syntax.
    premium = "<password>"

    # This message is displayed when the player attempts to get information about a user with wrong syntax.
    user-info = "<name>"

    # This message is displayed when the player attempts to migrate a user with wrong syntax.
    user-migrate = "<name> <newName>"

    # This message is displayed when the player attempts to unregister a user with wrong syntax.
    user-unregister = "<name>"

    # This message is displayed when the player attempts to delete a user with wrong syntax.
    user-delete = "<name>"

    # This message is displayed when the player attempts to enable autologin for another user with wrong syntax.
    user-premium = "<name>"

    # This message is displayed when the player attempts to disable autologin for another user with wrong syntax.
    user-cracked = "<name>"

    # This message is displayed when the player attempts to register another user with wrong syntax.
    user-register = "<name> <password>"

    # This message is displayed when the player attempts to log in another user with wrong syntax.
    user-login = "<name>"

    # This message is displayed when the player attempts to disable 2FA for another user with wrong syntax.
    "user-2fa-off" = "<name>"

    # This message is displayed when the player attempts to disable the email of another user with wrong syntax.
    user-email-off = "<name>"

    # This message is displayed when the player attempts to set the email of another user with wrong syntax.
    user-set-email = "<name> <email>"

    # This message is displayed when the player attempts to check the alternative accounts (alts) of another user with wrong syntax.
    user-alts = "<name>"

    # This message is displayed when the player attempts to change the password of another user with wrong syntax.
    user-pass-change = "<name> <newPassword>"

    # This message is displayed when the player attempts to confirm 2FA with wrong syntax.
    "2fa-confirm" = "<code>"

    # This message is displayed when the player attempts to change their password with wrong syntax.
    change-password = "<oldPassword> <newPassword>"

    # This message is displayed when the player attempts to test sending emails with wrong syntax.
    email-test = "<address>"

    # This message is displayed when the player attempts to set their email with wrong syntax.
    set-email = "<address> <password>"

    # This message is displayed when the player attempts to verify their email with wrong syntax.
    verify-email = "<code>"

    # This message is displayed when the player attempts to reset their password with wrong syntax.
    reset-password = ""

    # This message is displayed when the player attempts to confirm a password reset with wrong syntax.
    confirm-password-reset = "<code> <password> <passwordRepeat>"
}

# This section contains the autocompletion hints for commands. It is pretty large, so most people leave the defaults.
# !!DO NOT TRANSLATE @players!! It is used to suggest all online players.
autocomplete {
    # This hint is displayed when the player starts typing the /login command.
    login = "password"

    # This hint is displayed when the player starts typing the /register command.
    register = "password password"

    # This hint is displayed when the player starts typing the /premium command.
    premium = "password"

    # This hint is displayed when the player starts typing the /librelogin user info command.
    user-info = "@players"

    # This hint is displayed when the player starts typing the /librelogin user migrate command.
    user-migrate = "@players newName"

    # This hint is displayed when the player starts typing the /librelogin user unregister command.
    user-unregister = "@players"

    # This hint is displayed when the player starts typing the /librelogin user delete command.
    user-delete = "@players"

    # This hint is displayed when the player starts typing the /librelogin user premium command.
    user-premium = "@players"

    # This hint is displayed when the player starts typing the /librelogin user cracked command.
    user-cracked = "@players"

    # This hint is displayed when the player starts typing the /librelogin user register command.
    user-register = "@players password"

    # This hint is displayed when the player starts typing the /librelogin user login command.
    user-login = "@players"

    # This hint is displayed when the player starts typing the /librelogin user 2fa-off command.
    "user-2fa-off" = "@players"

    # This hint is displayed when the player starts typing the /librelogin user emailoff command.
    user-email-off = "@players"

    # This hint is displayed when the player starts typing the /librelogin user setemail command.
    user-set-email = "@players email"

    # This hint is displayed when the player starts typing the /librelogin user alts command.
    user-alts = "@players"

    # This hint is displayed when the player starts typing the /librelogin user pass-change command.
    user-pass-change = "@players newPassword"

    # This hint is displayed when the player starts typing the /2fa-confirm command.
    "2fa-confirm" = "code"

    # This hint is displayed when the player starts typing the /changepassword command.
    change-password = "oldPassword newPassword"

    # This hint is displayed when the player starts typing the /librelogin email test command.
    email-test = "address"

    # This hint is displayed when the player starts typing the /setemail command.
    set-email = "address password"

    # This hint is displayed when the player starts typing the /verifyemail command.
    verify-email = "code"

    # This hint is displayed when the player starts typing the /resetpassword command.
    reset-password = ""

    # This hint is displayed when the player starts typing the /confirmpasswordreset command.
    confirm-password-reset = "code newPassword newPassword"
}
